<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="'Microsoft YaHei', sans-serif">
  <!-- 背景 -->
  <rect width="420" height="300" fill="#ffffff"/>

  <!-- △ABC 三边（黑实线） -->
  <line x1="185" y1="21" x2="50" y2="255" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="255" x2="320" y2="255" stroke="#000000" stroke-width="2"/>
  <line x1="320" y1="255" x2="185" y2="21" stroke="#000000" stroke-width="2"/>

  <!-- PQ 连线（黑实线） -->
  <line x1="139" y1="115" x2="158" y2="255" stroke="#000000" stroke-width="2"/>

  <!-- 辅助线 PD⊥BC（红虚线） -->
  <line x1="139" y1="115" x2="139" y2="255" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- ∠B = 60° 圆弧 -->
  <path d="M 82 255 A 32 32 0 0 0 66 227" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="93" y="243" font-size="13" fill="#334155">60°</text>

  <!-- D 点直角符号 -->
  <path d="M 130 255 L 130 246 L 139 246" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- 顶点标注 -->
  <text x="185" y="14" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
  <text x="36" y="270" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
  <text x="334" y="270" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
  <text x="124" y="110" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">P</text>
  <text x="162" y="276" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">Q</text>
  <text x="127" y="276" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">D</text>

  <!-- 线段标注 -->
  <text x="158" y="84" font-size="13" fill="#334155" text-anchor="start">AP = t</text>
  <text x="56" y="182" font-size="13" fill="#334155" text-anchor="middle">PB = 3−t</text>
  <text x="96" y="280" font-size="13" fill="#334155" text-anchor="middle">BQ = t</text>
  <text x="147" y="190" font-size="13" fill="#dc2626" text-anchor="start">PD</text>
</svg>
