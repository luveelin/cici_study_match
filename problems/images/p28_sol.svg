<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 300" font-family="'Microsoft YaHei', sans-serif">
  <!-- 背景 -->
  <rect width="344" height="300" fill="#ffffff"/>

  <!-- 坐标映射：x_s = 190 + 24x, y_s = 130 - 24y（x、y 等比例尺） -->
  <!-- x 轴 -->
  <line x1="14" y1="130" x2="322" y2="130" stroke="#475569" stroke-width="1.5"/>
  <path d="M 322 130 l -9 -4 v 8 z" fill="#475569"/>
  <!-- y 轴 -->
  <line x1="190" y1="286" x2="190" y2="14" stroke="#475569" stroke-width="1.5"/>
  <path d="M 190 14 l -4 9 h 8 z" fill="#475569"/>

  <!-- 抛物线 y = x^2-x-6：顶点 (202,280)，精确二次贝塞尔 -->
  <path d="M 125.2 34.2 Q 202 525.8 278.8 34.2" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- AC、BC（灰实线） -->
  <line x1="142" y1="130" x2="190" y2="274" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="274" x2="266" y2="118" stroke="#64748b" stroke-width="1.5"/>

  <!-- 辅助线 AP∥BC（绿虚线），P(0,4) -->
  <line x1="142" y1="130" x2="198" y2="20" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4"/>
  <!-- 对称线 AD（红虚线），D(2.5,-2.25) -->
  <line x1="142" y1="130" x2="266" y2="192" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <!-- PP' 点线（示意 P 关于 AC 翻折到 P'） -->
  <line x1="190" y1="34" x2="46" y2="82" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- 点标记 -->
  <circle cx="142" cy="130" r="3" fill="#000000"/>
  <circle cx="262" cy="130" r="3" fill="#000000"/>
  <circle cx="190" cy="274" r="3" fill="#000000"/>
  <circle cx="190" cy="34" r="3.5" fill="#059669"/>
  <circle cx="46" cy="82" r="3.5" fill="#059669"/>
  <circle cx="250" cy="184" r="3.5" fill="#dc2626"/>

  <!-- 标注（空白区） -->
  <text x="180" y="146" font-size="13" fill="#475569">O</text>
  <text x="136" y="148" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
  <text x="262" y="148" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
  <text x="176" y="282" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
  <text x="198" y="44" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">P</text>
  <text x="36" y="86" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">P′</text>
  <text x="254" y="204" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">D</text>
  <text x="330" y="136" font-size="14" fill="#475569" font-style="italic">x</text>
  <text x="180" y="22" font-size="14" fill="#475569" font-style="italic">y</text>
</svg>
