<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="'Microsoft YaHei', sans-serif">
  <rect width="480" height="330" fill="#ffffff"/>

  <!-- 允许区域示意（x <= 46 侧的浅红底） -->
  <rect x="70" y="158" width="168" height="132" fill="#fdecec" opacity="0.55"/>

  <!-- 坐标轴 -->
  <line x1="55" y1="290" x2="365" y2="290" stroke="#334155" stroke-width="1.5"/>
  <polygon points="365,290 357,286 357,294" fill="#334155"/>
  <line x1="70" y1="300" x2="70" y2="70" stroke="#334155" stroke-width="1.5"/>
  <polygon points="70,70 66,78 74,78" fill="#334155"/>
  <text x="372" y="294" font-size="14" fill="#334155" font-style="italic">x</text>
  <text x="58" y="76" font-size="14" fill="#334155" font-style="italic">y</text>
  <text x="60" y="306" font-size="12" fill="#334155">O</text>

  <!-- x 轴刻度 -->
  <line x1="190" y1="287" x2="190" y2="293" stroke="#334155" stroke-width="1.5"/>
  <text x="190" y="306" font-size="12" fill="#334155" text-anchor="middle">40</text>
  <line x1="238" y1="287" x2="238" y2="293" stroke="#334155" stroke-width="1.5"/>
  <text x="238" y="306" font-size="12" fill="#334155" text-anchor="middle">46</text>
  <line x1="310" y1="287" x2="310" y2="293" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="306" font-size="12" fill="#334155" text-anchor="middle">55</text>
  <!-- y 轴刻度 -->
  <line x1="67" y1="208" x2="73" y2="208" stroke="#334155" stroke-width="1.5"/>
  <text x="62" y="212" font-size="12" fill="#334155" text-anchor="end">150</text>
  <line x1="67" y1="125" x2="73" y2="125" stroke="#334155" stroke-width="1.5"/>
  <text x="62" y="129" font-size="12" fill="#334155" text-anchor="end">300</text>

  <!-- 一次函数 y = -10x + 700（蓝实线） -->
  <line x1="134" y1="87" x2="350" y2="235" stroke="#2563eb" stroke-width="2.5"/>
  <text x="292" y="262" font-size="13" fill="#2563eb">y = −10x + 700</text>

  <!-- 约束线 y = 240（红虚线） -->
  <line x1="70" y1="158" x2="350" y2="158" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="345" y="152" font-size="13" fill="#dc2626" text-anchor="end">y = 240</text>

  <!-- 已知点 (40,300) 与 (55,150) -->
  <circle cx="190" cy="125" r="4" fill="#2563eb"/>
  <text x="196" y="116" font-size="12" fill="#2563eb">(40, 300)</text>
  <circle cx="310" cy="208" r="4" fill="#2563eb"/>
  <text x="314" y="228" font-size="12" fill="#2563eb">(55, 150)</text>

  <!-- 交点 (46,240) -->
  <circle cx="238" cy="158" r="4.5" fill="#dc2626"/>
  <text x="246" y="178" font-size="12" fill="#dc2626">(46, 240)</text>

  <!-- 约束说明 -->
  <text x="80" y="258" font-size="12.5" fill="#b91c1c">销量 ≥ 240 ⟺ x ≤ 46</text>
  <text x="80" y="276" font-size="11" fill="#64748b">（浅红区域为允许的售价范围 30 &lt; x ≤ 46）</text>
</svg>
