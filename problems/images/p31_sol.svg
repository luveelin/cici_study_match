<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="'Microsoft YaHei', sans-serif">
  <rect width="480" height="340" fill="#ffffff"/>

  <!-- 坐标轴 -->
  <line x1="60" y1="305" x2="395" y2="305" stroke="#334155" stroke-width="1.5"/>
  <polygon points="395,305 387,301 387,309" fill="#334155"/>
  <line x1="70" y1="315" x2="70" y2="60" stroke="#334155" stroke-width="1.5"/>
  <polygon points="70,60 66,68 74,68" fill="#334155"/>
  <text x="402" y="309" font-size="14" fill="#334155" font-style="italic">x</text>
  <text x="58" y="66" font-size="14" fill="#334155" font-style="italic">y</text>
  <text x="60" y="322" font-size="12" fill="#334155">O</text>

  <!-- x 轴刻度 5、10 -->
  <line x1="185" y1="302" x2="185" y2="308" stroke="#334155" stroke-width="1.5"/>
  <text x="185" y="322" font-size="12" fill="#334155" text-anchor="middle">5</text>
  <line x1="300" y1="302" x2="300" y2="308" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="322" font-size="12" fill="#334155" text-anchor="middle">10</text>
  <!-- y 轴刻度 5 -->
  <line x1="67" y1="140" x2="73" y2="140" stroke="#334155" stroke-width="1.5"/>
  <text x="62" y="144" font-size="12" fill="#334155" text-anchor="end">5</text>

  <!-- 曲线 y1 = x^2/20（蓝，开口向上） -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5"
    points="70,305 116,298 162,279 208,246 254,199 300,140 346,67"/>
  <text x="330" y="62" font-size="13" fill="#2563eb">y₁ = x²/20</text>

  <!-- 曲线 y2 = -3x^2/20 + 2x（绿，开口向下） -->
  <polyline fill="none" stroke="#16a34a" stroke-width="2.5"
    points="70,305 116,193 162,120 208,87 223,85 254,94 300,140 346,226 369,284 377,305"/>
  <text x="150" y="70" font-size="13" fill="#16a34a">y₂ = −3x²/20 + 2x</text>

  <!-- 交点 (10, 5) -->
  <circle cx="300" cy="140" r="5" fill="#dc2626"/>
  <text x="308" y="132" font-size="13" fill="#dc2626">(10, 5)</text>

  <!-- 原点交点 -->
  <circle cx="70" cy="305" r="4" fill="#dc2626"/>
  <text x="80" y="334" font-size="11.5" fill="#64748b">（另一交点 O(0, 0)）</text>
</svg>
