<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" font-family="'Microsoft YaHei', sans-serif">
  <rect width="480" height="310" fill="#ffffff"/>

  <!-- 坐标轴 -->
  <line x1="60" y1="270" x2="415" y2="270" stroke="#334155" stroke-width="1.5"/>
  <polygon points="415,270 407,266 407,274" fill="#334155"/>
  <line x1="70" y1="280" x2="70" y2="42" stroke="#334155" stroke-width="1.5"/>
  <polygon points="70,42 66,50 74,50" fill="#334155"/>
  <text x="420" y="274" font-size="13" fill="#334155" font-style="italic">x</text>
  <text x="58" y="48" font-size="13" fill="#334155" font-style="italic">y</text>
  <text x="56" y="286" font-size="12" fill="#334155">O</text>

  <!-- y 轴刻度 -->
  <line x1="66" y1="72" x2="74" y2="72" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="76" font-size="12" fill="#dc2626" text-anchor="end">m</text>
  <line x1="66" y1="138" x2="74" y2="138" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="142" font-size="12" fill="#334155" text-anchor="end">60</text>
  <line x1="66" y1="160" x2="74" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="164" font-size="12" fill="#334155" text-anchor="end">50</text>
  <line x1="66" y1="182" x2="74" y2="182" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="186" font-size="12" fill="#334155" text-anchor="end">40</text>
  <!-- x 轴刻度 -->
  <line x1="382" y1="266" x2="382" y2="274" stroke="#334155" stroke-width="1.5"/>
  <text x="382" y="288" font-size="12" fill="#334155" text-anchor="middle">120</text>

  <!-- 辅助虚线：B→40、D→50 -->
  <line x1="70" y1="182" x2="382" y2="182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70" y1="160" x2="382" y2="160" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 成本线 AB（蓝）：A(0,60) → B(120,40) -->
  <line x1="70" y1="138" x2="382" y2="182" stroke="#2563eb" stroke-width="2.5"/>
  <text x="205" y="176" font-size="13" fill="#2563eb">y₁（成本线）</text>

  <!-- 售价线 CD（绿）：C(0,m) → D(120,50) -->
  <line x1="70" y1="72" x2="382" y2="160" stroke="#16a34a" stroke-width="2.5"/>
  <text x="215" y="96" font-size="13" fill="#16a34a">y₂（售价线）</text>

  <!-- 端点 -->
  <circle cx="70" cy="138" r="4" fill="#2563eb"/>
  <circle cx="382" cy="182" r="4" fill="#2563eb"/>
  <circle cx="70" cy="72" r="4" fill="#16a34a"/>
  <circle cx="382" cy="160" r="4" fill="#16a34a"/>

  <!-- 点标注 -->
  <text x="78" y="132" font-size="13" fill="#2563eb" font-style="italic">A</text>
  <text x="388" y="196" font-size="13" fill="#2563eb" font-style="italic">B</text>
  <text x="52" y="66" font-size="13" fill="#16a34a" font-style="italic">C</text>
  <text x="388" y="152" font-size="13" fill="#16a34a" font-style="italic">D</text>

  <!-- 底部说明 -->
  <text x="86" y="302" font-size="12.5" fill="#64748b">成本：60 → 40；售价：m → 50（m &gt; 60）；利润 = (y₂ − y₁)·x</text>
</svg>
